kind = "web"
previewPath = "/"
title = "شكلك انت"
description = "A Saudi-themed imposter word game with online room codes, private roles, clue rounds, voting, chat, and pass-and-play on one device."
version = "1.0.0"
id = "artifacts/shaklak-enta"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22473

[services.development]
run = "pnpm --filter @workspace/shaklak-enta run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shaklak-enta", "run", "build" ]
serve = "static"
publicDir = "artifacts/shaklak-enta/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22473"
BASE_PATH = "/"
